<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Form Wireframe</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }
    .page {
      max-width: 900px;
      margin: 0 auto;
      border: 2px solid #000;
      background: #fff;
      padding: 16px;
    }
    .header {
      border: 2px solid #000;
      padding: 12px;
      margin-bottom: 16px;
    }
    .field {
      border: 2px solid #000;
      padding: 12px;
      margin-bottom: 12px;
      min-height: 48px;
    }
    .textarea {
      border: 2px solid #000;
      padding: 12px;
      margin-bottom: 12px;
      min-height: 90px;
    }
    .button {
      border: 2px solid #000;
      padding: 12px;
      width: 180px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">Event Form</div>
    <div class="field">Title: [____________________________]</div>
    <div class="field">Date: [__________]</div>
    <div class="field">Start Time: [__________]</div>
    <div class="field">End Time: [__________]</div>
    <div class="field">Location: [____________________________]</div>
    <div class="field">Contacts: [Select contacts]</div>
    <div class="textarea">Description: [____________________________]</div>
    <div class="button">Save Event</div>
  </div>
</body>
</html>
