<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacts Wireframe</title>
  <link rel="stylesheet" href="./contacts-wireframe.css">
</head>
<body>
  <div class="page">
    <h1>Contacts</h1>
    <div class="add-btn">Add Contact</div>

    <div class="table">
      <div class="row">
        <div class="cell">Name</div>
        <div class="cell">Email</div>
        <div class="cell">Phone</div>
        <div class="cell">Actions</div>
      </div>
      <div class="row">
        <div class="cell">John Doe</div>
        <div class="cell">john@email.com</div>
        <div class="cell">555-1234</div>
        <div class="cell">Edit Delete</div>
      </div>
      <div class="row">
        <div class="cell">Jane Smith</div>
        <div class="cell">jane@email.com</div>
        <div class="cell">555-5678</div>
        <div class="cell">Edit Delete</div>
      </div>
    </div>
  </div>
</body>
</html>
