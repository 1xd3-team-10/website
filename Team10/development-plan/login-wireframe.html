<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Wireframe</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .page {
      width: 420px;
      border: 2px solid #000;
      padding: 24px;
      background: #fff;
    }
    .title {
      border: 2px solid #000;
      padding: 16px;
      text-align: center;
      margin-bottom: 16px;
      font-weight: bold;
    }
    .field, .button, .note {
      border: 2px solid #000;
      padding: 14px;
      margin-bottom: 12px;
    }
    .note {
      margin-top: 20px;
      text-align: center;
      min-height: 70px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="title">Appointment Scheduler</div>
    <div class="field">Username</div>
    <div class="field">Password</div>
    <div class="button">Log In</div>
    <div class="note">Default dark mode interface</div>
  </div>
</body>
</html>
