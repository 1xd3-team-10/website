<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Wireframe</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }
    .page {
      border: 2px solid #000;
      background: #fff;
      min-height: 90vh;
      padding: 16px;
    }
    .layout {
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 16px;
      min-height: 80vh;
    }
    .sidebar, .main, .topnav, .calendar, .contact, .add-contact {
      border: 2px solid #000;
      padding: 12px;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .main {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .topnav {
      min-height: 60px;
    }
    .calendar {
      flex: 1;
      min-height: 500px;
    }
    .contact, .add-contact {
      min-height: 50px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="layout">
      <div class="sidebar">
        <div class="contact">Contacts Sidebar</div>
        <div class="contact">Alice Smith</div>
        <div class="contact">Bob Lee</div>
        <div class="contact">Carol White</div>
        <div class="add-contact">Add Contact</div>
      </div>

      <div class="main">
        <div class="topnav">Top Navigation</div>
        <div class="calendar">Calendar / Day View<br><br>[events shown in time/date slots]</div>
      </div>
    </div>
  </div>
</body>
</html>
